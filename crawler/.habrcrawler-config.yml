root: True

# Параметры подключения к MySQL (замените на реальные)
Database:
  Host: localhost
  Port: 3306
  User: root
  Password: root
  Name: habr_companies
  MinPoolSize: 1   # минимальный размер пула MySQL
  MaxPoolSize: 10  # максимальный размер пула MySQL

Habr:
  Enabled: True
  ProfileMode: False  # True = crawl company profiles for categories
  PostsMode: False    # True = crawl company posts lists (paginated)
  ArticleIdStart: 1
  ArticleIdEnd: 10000000
  UrlTemplate: 'https://habr.com/ru/companies/{company}/articles/{article_id}/'
  ProfileUrlTemplate: 'https://habr.com/ru/companies/{company}/profile/'
  PostsUrlTemplate: 'https://habr.com/ru/companies/{company}/posts/'
  SeedBatchSize: 20000

Crawl:
  MaxWorkers: 10
  MaxHostQPS: 2
  MaxTries: 3
  PageTimeout: 30.

UserAgent:
  Style: laptopplus
  MyPrefix: habrcompanies
  URL: https://github.com/Resident234/habr_companies

Logging:
  LoggingLevel: INFO
