root: True

# Параметры подключения к MySQL
Database:
  Host: localhost
  Port: 3306
  User: root
  Password: root
  Name: habr_companies
  MinPoolSize: 1   # минимальный размер пула MySQL
  MaxPoolSize: 10  # максимальный размер пула MySQL

Habr:
  ArticlesMode: False
  ArticlesPagesMode: False  # True = crawl company articles lists (paginated)
  ArticleIdStart: 1
  ArticleIdEnd: 10000000
  ArticleUrlTemplate: 'https://habr.com/ru/companies/{company}/articles/{article_id}/'
  ArticlesUrlTemplate: 'https://habr.com/ru/companies/{company}/articles/'

  PostsMode: False    # True = crawl company posts by numeric ID range
  PostPagesMode: False  # True = crawl company posts lists (paginated)
  PostIdStart: 1
  PostIdEnd: 10000000
  PostUrlTemplate: 'https://habr.com/ru/companies/{company}/posts/{post_id}/'
  PostsUrlTemplate: 'https://habr.com/ru/companies/{company}/posts/'

  NewsMode: False     # True = crawl company news by numeric ID range
  NewsPagesMode: True  # True = crawl company news lists (paginated)
  NewsIdStart: 1
  NewsIdEnd: 10000000
  NewsUrlTemplate: 'https://habr.com/ru/companies/{company}/news/{news_id}/'
  NewsPagesUrlTemplate: 'https://habr.com/ru/companies/{company}/news/'

  CategoriesMode: False  # True = crawl company profiles for categories
  LinksMode: False    # True = crawl company profiles for widget links
  LinksUrlTemplate: 'https://habr.com/kek/v2/companies/{company}/widgets/?fl=ru&hl=ru'
  BannersMode: False  # True = crawl company profiles for banner links
  BannersUrlTemplate: 'https://habr.com/kek/v2/companies/{company}/widgets/?fl=ru&hl=ru'

  SeedBatchSize: 20000
  ProfileUrlTemplate: 'https://habr.com/ru/companies/{company}/profile/'

Crawl:
  MaxDepth: 3
  MaxTries: 6
  ConnectTimeout: 20.
  PageTimeout: 45.
  RetryTimeout: 5
  MaxWorkers: 4
  MaxHostQPS: 2
  MaxPageSize: 1000000
  PreventCompression: False
  UpgradeInsecureRequests: 1
  QueueEmbeds: False
UserAgent:
  Style: laptopplus
  MyPrefix: habrcompanies
  URL: https://github.com/Resident234/habr_companies

Logging:
  LoggingLevel: INFO
